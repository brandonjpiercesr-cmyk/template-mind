name: doctrine-demo-parity

# These are adapted behavioral contracts from the canonical A'NEW suites. They load the
# Template runtime through pai/core and prove the mirrored dependency closure behaves as one
# engine: unavailable memory is not empty, memory writes require independent readback, a
# working-limit fallback keeps the full request, and paid egress belongs to its exact seat.
#
# ⬡B:ci.doctrine_demo_parity:WIRE:the_ceiling_ownership_law_runs_in_this_existing_job:20260731⬡
# The 20260731 ceiling ownership mirror was added to THIS job's existing list rather than to a
# new workflow file. Actions minutes are billed per job rounded up to a whole minute, and CI on
# the sister repository went dark for more than twenty hours on 20260731 when the account spend
# limit was reached. One more test file in a job that already runs the spend guard suite costs
# seconds of a minute already being paid for.
on:
  pull_request:
    branches: [ main ]

jobs:
  doctrine-demo-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the mirrored doctrine-to-demo runtime contracts
        run: >-
          node --test
          test/doctrine.find.in.brain.availability.test.js
          test/doctrine.fcw.memory.availability.test.js
          test/doctrine.people.tier.test.js
          test/doctrine.privacy.canonical.storage.test.js
          test/doctrine.privacy.mark.wires.read.test.js
          test/doctrine.privacy.routes.viewer.tier.test.js
          test/doctrine.privacy.world.release.test.js
          test/doctrine.lens.she.learns.test.js
          test/doctrine.logful.bank.test.js
          test/doctrine.logful.field.wired.test.js
          test/doctrine.tool.loop.write_to_brain.verified.test.js
          test/doctrine.memory.keeper.readback.test.js
          test/doctrine.memory.effect.release.gate.test.js
          test/doctrine.blocked.fallback.continuity.test.js
          test/doctrine.openrouter.seat.spend.test.js
          test/doctrine.spend.guard.fail.closed.test.js
          test/doctrine.no.coder.may.pick.a.ceiling.test.js
          test/provider.boundary.coda.budget.test.js
          test/provider.spend.receipt.durable.test.js
          test/migrate.test.js
          test/founder.state.doors.test.js
          test/day.memory.union.test.js
          test/fusion.span.today.test.js
          test/mind.entry.cycle-auth.test.js
