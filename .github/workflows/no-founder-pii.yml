name: no-founder-pii
# THE FOUNDER-PII LEAK-GUARD. Founder law 20260722: identity is env-only, per-world. This repo is the
# mind-template every world inherits, so it must be a TRUE ZERO: no email, phone, child's name, or
# HAM UID hardcoded anywhere in shippable code, or a stranger's deploy would carry a real human's
# data. The baseline here is empty on purpose. The denylist stores only SHA-256 hashes, so the guard
# never itself leaks what it guards.
on:
  pull_request:
    branches: [ main ]
jobs:
  no-founder-pii:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The guard's own tripwire runs FIRST. On 20260726 the guard printed a clean bill of health
      # over a real legal name because it had no name detector at all, so a passing scan is only
      # worth what the detectors behind it are worth. If the detectors regress, this fails here
      # rather than months later in somebody else's inherited world.
      - name: Prove the guard can still see what its law forbids
        run: node --test tests/no.founder.pii.sees.a.name.test.js
      # ⬡B:ci.no_founder_pii:WIRE:a_guard_nobody_registered_never_runs:20260801⬡
      # tests/no.founder.pii.md.scan.test.js was written on 20260727 to lock the markdown fix and
      # was never added to any workflow, so it has proved nothing for five days. Registered here,
      # in the same job as the gate it guards, by this estate's standing lesson.
      - name: Prove the detectors still bite inside a Markdown file
        run: node --test tests/no.founder.pii.md.scan.test.js
      # That suite calls scanFile() directly, and scanFile() never consults the extension list at
      # all: walk() does. Measured 20260801, removing 'md' from SCANNED_EXT_RE leaves it 2 pass /
      # 0 fail, so it locks the DETECTORS and never the ROSTER. This one drives the real CLI over
      # a real temp tree, which is the only way to prove which files a walker actually opens.
      - name: Prove the gate actually opens every shipped text format
        run: node --test tests/the.gate.reads.every.shipped.text.format.test.js
      # ⬡B:ci.no_founder_pii:WIRE:the_law_named_four_things_and_the_gate_saw_three:20260801⬡
      # The founder law forbids email, phone, HAM UID, name AND personal address. Three of the
      # four had detectors; address never had one in either repo. This is the TRUE ZERO template,
      # so the detector must be here too and must stay at zero findings, never baselined.
      - name: Prove the gate can see a personal address
        run: node --test tests/the.gate.can.see.an.address.test.js
      - name: Scan for hardcoded founder identity (must be zero)
        run: node scripts/checks/no-founder-pii.js .
      # ⬡B:github.no_founder_pii:WIRE:the_standing_goal_ships_to_every_inherited_world:20260731⬡
      # Founder order 20260731, given twice: progress assignments and roadmaps until completion,
      # make it a STANDING GOAL, build check-ins. This repo is the mind-template, so what lands in
      # its CLAUDE.md is what every future world starts with. This step fails the build if the
      # standing goal, the consult door, or the five-flag reporting shape is removed from it.
      #
      # It rides as a STEP in this existing workflow, never as a new workflow file, for the same
      # billing reason recorded in the sister repo: on 20260731 CI went dark for more than twenty
      # hours on Actions billing, and every job is billed rounded UP to a whole minute.
      #
      # The marker list is the same one enforced in `anew` by scripts/checks/standing-goal-guard.js,
      # which is the source of record and carries the reasoning for each marker. It is asserted
      # inline here rather than by shipping a second copy of that script, because a second
      # hand-maintained copy is exactly what the one-source law forbids. Verified on 20260731 by
      # running the anew guard against this repo with --root and --claude-md-only: 17/17 present.
      - name: The standing goal is still law in the mind-template
        shell: bash
        run: |
          set -uo pipefail
          missing=0
          check() {
            if ! grep -qF -- "$2" CLAUDE.md; then
              echo "  MISSING: $1"
              missing=$((missing+1))
            fi
          }
          check "the standing goal has a section of its own"      "THE STANDING GOAL"
          check "the founder's own words are quoted"              "PROGRESS YOUR ASSIGNMENTS AND ROADMAPS UNTIL COMPLETION"
          check "an assignment ends when it is DONE"              "assignment ends when it is **DONE**"
          check "the checkout names the re-arm"                   "re-arm"
          check "the consult door with its full URL"              "https://aibebase.onrender.com/cara/consult"
          check "the consult auth header"                         "x-cara-consult-key"
          check "the coder decides after the consult"             "then you decide and act"
          check "a consult FEEDS her, never borrows her voice"    "FEEDING her"
          check "questions reach him only on his four kinds"      "spend he has not authorised"
          check "GREEN flag"                                      "🟢"
          check "YELLOW flag"                                     "🟡"
          check "ORANGE flag"                                     "🟠"
          check "BLACK flag"                                      "⚫"
          check "RED flag"                                        "🔴"
          check "OUTSTANDING BY HIM rides every report"           "OUTSTANDING BY HIM"
          check "a RED carries the exact value to type"           "exact value to type"
          check "the doctrine file is pointed at"                 "PROGRESS_UNTIL_COMPLETION_20260731"
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "THE STANDING GOAL GUARD FAILED: $missing marker(s) gone from CLAUDE.md."
            echo "Founder order 20260731: progress your assignments and roadmaps until completion."
            echo "This repo is the mind-template. A law removed here is removed from every world that inherits it."
            echo "Source of record for the markers and the reasoning: anew scripts/checks/standing-goal-guard.js"
            exit 1
          fi
          echo "standing-goal markers: 17/17 present in the mind-template's CLAUDE.md."
